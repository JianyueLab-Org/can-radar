# 在线雷达在 jyl-tyo 上的部署。
#
# 形状和 can-dev / llm-web 一致：一个应用一个 namespace，Deployment 和 Service
# 都叫 app，Service 暴露 80，Ingress 走默认的 cloudflare-tunnel（控制器会把
# radar.airwaysn.org 的 DNS 记录建好）。
#
# ---------------------------------------------------------------------------
# 这里不再有导航数据
# ---------------------------------------------------------------------------
#
# 航路解析搬去 can-api 了，这个站点的 /api/v1/route 只是一个转发。原来那个
# ReadWriteMany 的 navdata PVC 和 NAVDATA_DIR 一起去掉了 —— 这个仓库公开、镜
# 像也在公开的 GHCR 上，一份商业 AIRAC 派生数据不该在这一侧的任何地方落地。
#
# 卷现在挂在 can-api 上，见那边的 deploy/k8s.yaml。上游没挂上时它回 503，
# 透过来之后地图退回直飞弧线，这一侧起不起得来和它无关。
#
# **删除这个命名空间里遗留的 navdata PVC 是手工的一步**：清单里没有它了，
# apply 不会替你删。确认 can-api 那边已经灌好之后：
#   kubectl -n can-radar delete pvc navdata
---
apiVersion: v1
kind: Namespace
metadata:
  name: can-radar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-radar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: can-radar
  template:
    metadata:
      labels:
        app: can-radar
    spec:
      containers:
        - name: app
          image: ghcr.io/jianyuelab-org/can-radar:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            # 航迹转发的上游。can-api 而不是 can-web —— 路径一个字没变，换的
            # 只是主机。
            - name: CAN_API_ORIGIN
              value: https://api.airwaysn.org
          # 首页不碰 can-web，所以它是个诚实的探活目标。注意它**不**能证明航
          # 路解析可用 —— can-api 那边没挂上导航数据时首页照样 200，只是选中
          # 飞机看不到航路。那要靠 /api/v1/route 手动验。
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              # navdata 是就地二分查找、不解析成字典的，常驻约 25 MB；
              # 解析成对象的写法会是 320 MB，那正是它长成现在这样的原因。
              memory: 192Mi
            limits:
              memory: 512Mi
          # 这四条是 PodSecurity 的 restricted 档要的。镜像里本来就是 USER
          # node 在跑，但那是镜像的事，集群看不见 —— 不显式声明 runAsNonRoot
          # 就只能按「可能是 root」对待，apply 时会报警告。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # 必须是数字。镜像里写的是 USER node（名字），kubelet 解析不了名
            # 字，于是 runAsNonRoot 无从验证，容器直接 CreateContainerConfigError。
            # 1000 就是 node 镜像里 node 用户的 uid。
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-radar
spec:
  selector:
    app: can-radar
  ports:
    - port: 80
      targetPort: 4321
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-radar
  namespace: can-radar
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: radar.airwaysn.org
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
