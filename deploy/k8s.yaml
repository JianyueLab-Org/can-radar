# 在线雷达在 jyl-tyo 上的部署。
#
# 形状和 can-dev / llm-web 一致：一个应用一个 namespace，Deployment 和 Service
# 都叫 app，Service 暴露 80，Ingress 走默认的 cloudflare-tunnel（控制器会把
# radar.airwaysn.org 的 DNS 记录建好）。
#
# ---------------------------------------------------------------------------
# 导航数据不在镜像里，这一条是这份清单最要紧的地方
# ---------------------------------------------------------------------------
#
# data/navdata 是 AIRAC 派生的商业数据。can-web 把它提交进自己仓库的唯一理由
# 是那个仓库私有；can-radar 是**公开**仓库，镜像也在公开的 GHCR 上，所以它既
# 不进 git 也不进镜像层 —— 打进去就等于把那个数据库发出去了。
#
# 于是运行时从一个 PVC 挂进来（下面那个），NAVDATA_DIR 指过去。
#
# Secret 不行 —— 上限 1 MiB，整套 navdata 是 5.9 MB。ConfigMap 也不行，它存不
# 了二进制而这些是 gzip。PVC 的 accessModes 是 **ReadWriteMany**：Deployment
# 有 2 个副本，可能落在不同节点，RWO 的卷只挂得上一个节点，另一个副本会一直
# ContainerCreating。longhorn 用 share manager 支持 RWX。
#
# 数据是手工灌进去的（起一个挂着这个 PVC 的临时 Pod，kubectl cp 进去，再删
# 掉）。它不跟着镜像走，所以换镜像不会动它；换 AIRAC 周期时要重新灌一次。
#
# 挂载缺席也不会让服务起不来：/api/v1/route 回 503，地图退回直飞弧线。
---
apiVersion: v1
kind: Namespace
metadata:
  name: can-radar
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navdata
  namespace: can-radar
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-radar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: can-radar
  template:
    metadata:
      labels:
        app: can-radar
    spec:
      volumes:
        - name: navdata
          persistentVolumeClaim:
            claimName: navdata
            readOnly: true
      containers:
        - name: app
          image: ghcr.io/jianyuelab-org/can-radar:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            - name: CAN_WEB_ORIGIN
              value: https://airwaysn.org
            - name: NAVDATA_DIR
              value: /srv/navdata
          volumeMounts:
            - name: navdata
              mountPath: /srv/navdata
              readOnly: true
          # 首页不碰 can-web，也不需要导航数据，所以它是个诚实的探活目标。
          # 注意它**不**能证明航路解析可用 —— navdata 没挂上时首页照样 200，
          # 只是选中飞机看不到航路。那要靠 /api/v1/route 手动验。
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              # navdata 是就地二分查找、不解析成字典的，常驻约 25 MB；
              # 解析成对象的写法会是 320 MB，那正是它长成现在这样的原因。
              memory: 192Mi
            limits:
              memory: 512Mi
          # 这四条是 PodSecurity 的 restricted 档要的。镜像里本来就是 USER
          # node 在跑，但那是镜像的事，集群看不见 —— 不显式声明 runAsNonRoot
          # 就只能按「可能是 root」对待，apply 时会报警告。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # 必须是数字。镜像里写的是 USER node（名字），kubelet 解析不了名
            # 字，于是 runAsNonRoot 无从验证，容器直接 CreateContainerConfigError。
            # 1000 就是 node 镜像里 node 用户的 uid。
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-radar
spec:
  selector:
    app: can-radar
  ports:
    - port: 80
      targetPort: 4321
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-radar
  namespace: can-radar
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: radar.airwaysn.org
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
