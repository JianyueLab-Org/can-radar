# 在线雷达在 jyl-tyo 上的部署。
#
# 形状和 can-dev / llm-web 一致：一个应用一个 namespace，Deployment 和 Service
# 都叫 app，Service 暴露 80，Ingress 走默认的 cloudflare-tunnel（控制器会把
# radar.ceruleanavi.net 的 DNS 记录建好）。
#
# ---------------------------------------------------------------------------
# 这里不再有导航数据
# ---------------------------------------------------------------------------
#
# 航路解析搬去 can-api 了，这个站点的 /api/v1/route 只是一个转发。原来那个
# ReadWriteMany 的 navdata PVC 和 NAVDATA_DIR 一起去掉了 —— 这个仓库公开、镜
# 像也在公开的 GHCR 上，一份商业 AIRAC 派生数据不该在这一侧的任何地方落地。
#
# 卷现在挂在 can-api 上，见那边的 deploy/k8s.yaml。上游没挂上时它回 503，
# 透过来之后地图退回直飞弧线，这一侧起不起得来和它无关。
#
# **删除这个命名空间里遗留的 navdata PVC 是手工的一步**：清单里没有它了，
# apply 不会替你删。确认 can-api 那边已经灌好之后：
#   kubectl -n can-radar delete pvc navdata
---
apiVersion: v1
kind: Namespace
metadata:
  name: can-radar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-radar
spec:
  replicas: 2
  # **滚动更新期间不留窗口。** 默认策略配上一个说走就走的进程，等于每次部署都
  # 有一两秒 502：Pod 被删时 kubelet 立刻发 SIGTERM，而它从 Service 端点里摘掉是
  # **异步**传播的，于是入口仍会把请求转给一个正在退出的进程，拿到 connection
  # refused —— 在 cloudflare-tunnel 后面，前端看到的就是 502。
  #
  # 这不是理论：can-efb 上线当天就被撞上了，集群事件里留着那条
  # `Readiness probe failed: connection refused`（老 Pod 正在被杀）。
  #
  # maxUnavailable: 0 保证新 Pod 就绪之前不摘老的；真正消掉窗口的是下面容器里的
  # preStop，两者缺一不可。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: can-radar
  template:
    metadata:
      labels:
        app: can-radar
    spec:
      containers:
        - name: app
          image: ghcr.io/jianyuelab-org/can-radar:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            # 航迹转发的上游。can-api 而不是 can-web —— 路径一个字没变，换的
            # 只是主机。会话也问它：浏览器带来的 can_session 转发过去问一次
            # 「这是谁」，这个站点自己不验签（密钥不该在这个部署里）。
            - name: CAN_API_ORIGIN
              value: https://api.ceruleanavi.net
            # 主站。页眉那排导航和唯一的登录入口指向它 —— 这里是另一个源。
            - name: CAN_WEB_ORIGIN
              value: https://ceruleanavi.net
            # 本站自己的对外地址，只用来校验写操作（登出）的 Origin。
            #
            # **不能省。** 省掉的话它是开发机的 localhost，而浏览器发来的是
            # https://radar.ceruleanavi.net，登出会稳定地 403。它是显式配置而不是
            # 从 Host 头推的：这个 Pod 前面是 cloudflare-tunnel，请求头里的东西
            # 正是那一层能改的东西（Astro 自带的 checkOrigin 也是因此关掉的）。
            - name: PUBLIC_ORIGIN
              value: https://radar.ceruleanavi.net
          # 首页不碰 can-web，所以它是个诚实的探活目标。注意它**不**能证明航
          # 路解析可用 —— can-api 那边没挂上导航数据时首页照样 200，只是选中
          # 飞机看不到航路。那要靠 /api/v1/route 手动验。
          # 先睡再退，把端点摘除的传播时间让出来 —— 见上面 strategy 那段。
          #
          # 睡 10 秒是因为 terminationGracePeriodSeconds 默认 30：preStop 跑完才
          # 会发 SIGTERM，留 20 秒给进程自己收尾绰绰有余。调大这个值就要一起调大
          # 宽限期，否则会被硬 kill，反而更糟。
          #
          # 用得了 exec 是因为运行时镜像是 node:22-alpine，busybox 自带 sleep。
          # 哪天基底换成 distroless，这里会**静默失效**（preStop 失败不拦停机），
          # 那时得改用进程内处理 SIGTERM 的写法。
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              # navdata 是就地二分查找、不解析成字典的，常驻约 25 MB；
              # 解析成对象的写法会是 320 MB，那正是它长成现在这样的原因。
              memory: 192Mi
            limits:
              memory: 512Mi
          # 这四条是 PodSecurity 的 restricted 档要的。镜像里本来就是 USER
          # node 在跑，但那是镜像的事，集群看不见 —— 不显式声明 runAsNonRoot
          # 就只能按「可能是 root」对待，apply 时会报警告。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # 必须是数字。镜像里写的是 USER node（名字），kubelet 解析不了名
            # 字，于是 runAsNonRoot 无从验证，容器直接 CreateContainerConfigError。
            # 1000 就是 node 镜像里 node 用户的 uid。
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-radar
spec:
  selector:
    app: can-radar
  ports:
    - port: 80
      targetPort: 4321
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-radar
  namespace: can-radar
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: radar.ceruleanavi.net
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
