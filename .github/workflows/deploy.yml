name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 出镜像 + 滚 Deployment，走组织里那份可复用工作流，和别的 JYL 项目一个形状。
# 之前这里是一个只推镜像的 image.yml，上线要人手工 rollout —— 那一步没有部署
# 记录，也没人知道线上跑的是哪个 commit。
#
# manifest 传进去是因为它会先 apply 一次：光 set image 要求 Deployment 已经存
# 在，第一次部署或者 namespace 被删过之后会直接失败。
# 权限要在**调用方**声明：可复用工作流里的 permissions 是它需要什么，不是它
# 能拿到什么。仓库默认的 GITHUB_TOKEN 只有 packages: read / deployments: none，
# 于是被拒在启动阶段 —— 而 startup_failure 是拿不到日志的，只在网页上写一行
# "requesting 'deployments: write, packages: write'"。can-web 的 deploy.yml
# 顶层本来就有这一段。
permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  deploy:
    uses: JianyueLab-Org/actions/.github/workflows/deploy-k8s.yml@main
    with:
      image: ghcr.io/jianyuelab-org/can-radar
      namespace: can-radar
      manifest: deploy/k8s.yaml
      environment_url: https://radar.ceruleanavi.net
    secrets: inherit
